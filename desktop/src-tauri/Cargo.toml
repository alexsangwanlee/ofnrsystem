[package]
name = "ofnr-ops"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "ofnr_ops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.5"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-autostart = "2.7"
tauri-plugin-window-state = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tokio = { version = "1", features = ["sync"] }
